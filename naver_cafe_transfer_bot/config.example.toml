# 네이버 카페 "일정 부담 양도글" 텔레그램 알림 봇 설정
# 이 파일을 config.toml 로 복사한 뒤 원하는 대로 수정하세요.
# (API 키/토큰 같은 비밀값은 여기 말고 .env 에 넣습니다)

[search]
# 네이버 검색 API(카페글)로 검색할 검색어 목록.
# 양도하려는 대상(예: "필라테스", "PT", "헬스", "골프 레슨", "콘서트")을 붙이면 정확도가 올라갑니다.
queries = [
  "양도 일정",
  "양도 스케줄",
  "양도 시간이 안",
  "양도 바빠서",
  "양도 출장",
  "양도 개인사정",
]
# 검색어 하나당 가져올 최대 글 수 (1~1000, 100 단위로 페이지를 넘깁니다)
max_results_per_query = 100
# "date"(최신순) 또는 "sim"(정확도순)
sort = "date"
# 특정 카페만 보고 싶으면 카페 주소의 아이디를 넣으세요. 예: ["joonggonara", "mycafe123"]
# 비워두면 모든 카페 대상.
cafe_ids = []

[filter]
# 제목/본문에 반드시 하나 이상 있어야 하는 "양도" 관련 표현
transfer_keywords = [
  "양도", "양도합니다", "넘겨드립니다", "넘깁니다", "양수자 구", "양수자구", "양수인 구",
]
# 일정 관리 부담 등 '사정' 을 나타내는 표현 (하나 이상 있어야 통과)
reason_keywords = [
  "일정", "스케줄", "스케쥴", "시간이 안", "시간이 없", "시간 부족", "시간부족",
  "바빠", "바빠서", "바쁜", "바쁘", "출장", "야근", "교대근무", "근무 시간", "근무시간",
  "이사", "이직", "취업", "발령", "개인사정", "개인 사정", "사정상", "사정으로",
  "못 가", "못가", "못 다니", "못다니", "다닐 시간", "참석이 어려", "참석 불가", "참석불가",
  "관리 부담", "관리가 힘", "관리하기 힘", "부담", "여유가 없", "병행",
]
# 이 표현이 하나라도 있으면 제외 (명의 변경/이전 목적, 구매 희망글, 거래 완료글 등)
exclude_keywords = [
  "명의변경", "명의 변경", "명의이전", "명의 이전", "명의양도", "명의 양도", "명변",
  "명의자 변경", "명의 바꿔", "명의만",
  "양수합니다", "양수 원합니다", "양수원합니다", "구합니다", "삽니다", "구매합니다",
  "양도완료", "양도 완료", "거래완료", "거래 완료", "판매완료", "[완료]",
]
# true 이면 reason_keywords 가 하나도 없는 글은 제외 (권장)
require_reason = true
# 검색 결과 요약만으로 판단이 애매할 때 카페 본문 API 로 본문을 추가로 읽어볼지 여부
# (공개 카페만 가능, 실패해도 요약으로 판단합니다)
fetch_full_text = true

[run]
# 루프 모드(--loop)에서 검사 주기(초)
interval_seconds = 600
# 이미 보낸 글을 기억하는 SQLite 파일 경로
db_path = "seen_articles.db"
# 한 번 실행에서 텔레그램으로 보낼 최대 글 수 (스팸 방지)
max_messages_per_run = 30
