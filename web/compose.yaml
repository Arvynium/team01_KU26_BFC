services:
  bfc:
    build: .
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    ports:
      - "${BFC_BIND_IP:-127.0.0.1}:${BFC_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - edge
      - services

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    environment:
      DATA_DIR: /app/data
      GEAR_CATALOG_URL: http://gear-catalog:8081
      PHOTO_WORKER_URL: http://photo-worker:8084
      MANUAL_WORKER_URL: http://manual-worker:8085
      REQUEST_OBSERVER_URL: http://request-observer:8083
      REVIEWER_URL: http://staff-reviewer:8086
      PACKAGE_WORKER_URL: http://package-worker:8087
      LAB_REVIEW_SECRET: "${LAB_REVIEW_SECRET:?Set a review secret in an env file}"
      LAB_XSS_FLAG: "${LAB_XSS_FLAG:?Set an XSS flag in an env file}"
    volumes:
      - bfc-data:/app/data
    networks:
      - services
      - packages

  gear-catalog:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "services.gear_catalog:app", "--host", "0.0.0.0", "--port", "8081"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    environment:
      LAB_SQL_FLAG: "${LAB_SQL_FLAG:?Set a SQL flag in an env file}"
      LAB_PATH_FLAG: "${LAB_PATH_FLAG:?Set a path flag in an env file}"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - services

  internal-media:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "services.internal_media:app", "--host", "0.0.0.0", "--port", "8082"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - services

  request-observer:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["uvicorn", "services.request_observer:app", "--host", "0.0.0.0", "--port", "8083"]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - services

  staff-reviewer:
    build:
      context: .
      dockerfile: Dockerfile.reviewer
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 192
    shm_size: 256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/reviewer:size=64m,mode=0700,uid=10001,gid=10001
    environment:
      LAB_REVIEW_SECRET: "${LAB_REVIEW_SECRET:?Set a review secret in an env file}"
    networks:
      - edge
      - services

  photo-worker:
    build:
      context: .
      dockerfile: Dockerfile.imagemagick
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 96
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /work:size=96m,mode=0700,uid=10001,gid=10001
    networks:
      - services

  manual-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ghostscript
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 96
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /work:size=96m,mode=0700,uid=10001,gid=10001
    networks:
      - services

  package-worker:
    build:
      context: .
      dockerfile: Dockerfile.package
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 48
    environment:
      LAB_COMMAND_FLAG: "${LAB_COMMAND_FLAG:?Set a command flag in an env file}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /work:size=48m,mode=0700,uid=10001,gid=10001
    networks:
      - packages

volumes:
  bfc-data:

networks:
  edge:
  services:
    internal: true
  packages:
    internal: true
